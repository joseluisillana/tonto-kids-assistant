# Dependency setup and automated checks. Never add runtime credentials here.
services:
  backend:
    image: python:3.12-slim
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./backend:/app/backend:ro
      - ./client:/app/client:ro
      - ./shared:/app/shared:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./tonto.sh:/app/tonto.sh:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./docker-compose.tasks.yml:/app/docker-compose.tasks.yml:ro
      - ./requirements-dev.txt:/app/requirements-dev.txt:ro
      - ./.cache/pip:/app/.cache/pip
      - ./.cache/npm:/app/.cache/npm
      - ./.cache/pytest-fixtures:/app/.cache/pytest-fixtures
      - ./.cache/client-audio-tests:/app/.cache/client-audio-tests
      - backend-venv:/app/.venv
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_CACHE_DIR: /app/.cache/pip

  web:
    image: node:22
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./web/src:/app/web/src:ro
      - ./web/tests:/app/web/tests:ro
      - ./web/index.html:/app/web/index.html:ro
      - ./web/package.json:/app/web/package.json:ro
      - ./web/package-lock.json:/app/web/package-lock.json:ro
      - ./web/tsconfig.json:/app/web/tsconfig.json:ro
      - ./web/tsconfig.node.json:/app/web/tsconfig.node.json:ro
      - ./web/tsconfig.test.json:/app/web/tsconfig.test.json:ro
      - ./web/vite.config.ts:/app/web/vite.config.ts:ro
      - ./web/node_modules:/app/web/node_modules
      - ./web/dist:/app/web/dist
      - ./web/.tmp-test:/app/web/.tmp-test
      - ./.cache/npm:/app/.cache/npm
    working_dir: /app/web
    environment:
      npm_config_cache: /app/.cache/npm

  ui-emulator:
    build:
      context: ./client
      dockerfile: Dockerfile.ui
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./backend:/app/backend:ro
      - ./client:/app/client:ro
      - ./shared:/app/shared:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./tonto.sh:/app/tonto.sh:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./docker-compose.tasks.yml:/app/docker-compose.tasks.yml:ro
      - ./requirements-dev.txt:/app/requirements-dev.txt:ro
      - ./.cache/pip:/app/.cache/pip
      - ./.cache/npm:/app/.cache/npm
      - ./.cache/pytest-fixtures:/app/.cache/pytest-fixtures
      - ./.cache/client-audio-tests:/app/.cache/client-audio-tests
      - backend-venv:/app/.venv
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

volumes:
  backend-venv:
