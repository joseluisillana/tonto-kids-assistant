services:
  backend:
    image: python:3.12-slim
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./backend:/app/backend:ro
      - ./shared:/app/shared:ro
      - backend-venv:/app/.venv
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PIP_CACHE_DIR=/app/.cache/pip
    command: .venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:22
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./web/src:/app/web/src:ro
      - ./web/tests:/app/web/tests:ro
      - ./web/index.html:/app/web/index.html:ro
      - ./web/package.json:/app/web/package.json:ro
      - ./web/package-lock.json:/app/web/package-lock.json:ro
      - ./web/tsconfig.json:/app/web/tsconfig.json:ro
      - ./web/tsconfig.node.json:/app/web/tsconfig.node.json:ro
      - ./web/tsconfig.test.json:/app/web/tsconfig.test.json:ro
      - ./web/vite.config.ts:/app/web/vite.config.ts:ro
      - ./web/node_modules:/app/web/node_modules
      - ./web/dist:/app/web/dist
      - ./web/.tmp-test:/app/web/.tmp-test
      - ./.cache/npm:/app/.cache/npm
    working_dir: /app/web
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://127.0.0.1:8000
      - npm_config_cache=/app/.cache/npm
    command: npm run dev -- --host 0.0.0.0 --port 5173

  ui-emulator:
    build:
      context: ./client
      dockerfile: Dockerfile.ui
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./client:/app/client:ro
      - ./shared:/app/shared:ro
      - backend-venv:/app/.venv
      - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /app
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - KIVY_WINDOW=sdl2
      - KIVY_HOME=/tmp/.kivy-runtime
      - XDG_CACHE_HOME=/tmp/.cache
      - TONTO_AUDIO_MODE=pc
      - TONTO_AUDIO_DEVICE=${TONTO_AUDIO_DEVICE:-}
      - TONTO_BACKEND_URL=http://backend:8000
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
    depends_on:
      - backend
    command: .venv/bin/python -m client.touch_ui

volumes:
  backend-venv:
