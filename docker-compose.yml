services:
  backend:
    image: python:3.12-slim
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - .:/app
      - backend-venv:/app/.venv
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    command: .venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:22
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - ./web:/app/web
    working_dir: /app/web
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://127.0.0.1:8000
      - npm_config_cache=/tmp/.npm
    command: npm run dev -- --host 0.0.0.0 --port 5173

  ui-emulator:
    build:
      context: .
      dockerfile: client/Dockerfile.ui
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    volumes:
      - .:/app
      - backend-venv:/app/.venv
      - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /app
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - KIVY_WINDOW=sdl2
      - TONTO_AUDIO_MODE=pc
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
    command: .venv/bin/python client/touch_ui.py

volumes:
  backend-venv:
